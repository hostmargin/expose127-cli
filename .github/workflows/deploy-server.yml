name: Deploy Server

on:
  push:
    branches: [main]
    paths:
      - 'server/**'        # only triggers when server code changes

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key:      ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/hostmargin-server
            git pull origin main
            npm ci --omit=dev
            pm2 restart hostmargin-server --update-env
            pm2 save
